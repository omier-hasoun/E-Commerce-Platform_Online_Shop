<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link data-page-css rel="stylesheet" href="/css/pages/product-view.css">

    <script type="module" src="/js/app.js"></script>
</head>
<body data-page="product-view">
    <app-header></app-header>

    <div id="sidebar">
    </div>

    <main id="content">
        <div class="product-view" >
            <section class="a-product">
                <product-gallery id="productGallery" class="product-gallery"></product-gallery>

                <h1 id="productTitle" class="product-title"></h1>

                <div class="product-info">
                    <div id="productRating" class="rating"></div>
                    <div id="productStock" class="stock"></div>
                    <product-price id="productPrice" class="price" ></product-price>
                    <input id="quantityInput" class="quantity-input" type="number" max="1000" min="1" value="1">
                    <button id="addtocartBtn" class="addtocart-btn">
                        Add to cart
                    </button>
                </div>
            </section>

            <section class="b-product">
                <div class="description">
                    <h2>Description:</h2>
                    <p id="productDescription" ></p>
                </div>

                <dl id="productSpecifications" class="specifications">
                    <h2>Specifications:</h3>
                </dl>
            </section>


        </div>
    </main>
    <app-footer></app-footer>
</body>
</html>
