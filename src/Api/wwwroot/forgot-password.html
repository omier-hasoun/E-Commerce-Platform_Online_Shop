<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
  <link rel="stylesheet" href="/css/authentication-flow.css">

</head>
<body>
  <main class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset it.</p>

    <!-- Show this after the request succeeds (remove the hidden attribute) -->
    <p class="msg ok" id="sent-message" role="status" hidden>A password reset link has been sent to your email.</p>
    <p class="msg err" id="error-message" role="alert" hidden>We couldn't send the link. Try again.</p>

    <form id="forgot-form" method="post" action="#">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button class="btn" type="submit">Send reset link</button>
    </form>

    <p class="foot"><a href="login">Back to log in</a></p>
  </main>
</body>
</html>
