<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link data-page-css rel="stylesheet" href="/css/authentication-flow.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p class="sub">Choose a password you haven't used before.</p>

    <p class="msg ok" id="success-message" role="status" hidden>Your password has been changed. You can now log in.</p>
    <p class="msg err" id="error-message" role="alert" hidden>The passwords don't match, or the link has expired.</p>

    <form id="reset-form" method="post" action="#">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm_password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn" type="submit">Save new password</button>
    </form>

    <p class="foot"><a href="login.html">Back to log in</a></p>
  </main>
</body>
</html>
