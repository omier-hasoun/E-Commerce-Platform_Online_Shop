<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link data-page-css rel="stylesheet" href="/css/pages/product-editor.css">

    <script type="module" src="/js/app.js"></script>
</head>
<body data-page="product-editor">
    <app-header></app-header>

    <div id="sidebar">
    </div>

    <main id="content">
        <form action="">

            <fieldset>
                <legend>Product Information</legend>

                <div class="data-input">
                    <label for="FileInput">Product Images</label>
                    <input id="FileInput" type="file" name="images" multiple
                        accept="image/png, image/gif, image/jpeg, image/webp, image/bmp, image/tiff, image/avif">
                </div>

                <div class="data-input">
                    <label for="titleInput">Title</label>
                    <input type="text" name="title" id="titleInput">
                </div>

                <div class="data-input">
                    <label for="descriptionInput">Description</label>
                    <input type="text" name="description" id="descriptionInput">
                </div>

                <div class="data-input">
                    <label for="categoryInput">Category</label>
                    <category-selector name="category" id="categoryInput"></category-selector>
                </div>

                <div class="data-input">
                    <label for="brandInput">Brand</label>
                    <brand-selector name="brand" id="brandInput"></brand-selector>
                </div>
            </fieldset>

            <fieldset>
                <legend>Product Dimensions & Weight (cm, gram)</legend>

                <div class="data-input">
                    <label for="widthInput">Width</label>
                    <input type="number" name="width" id="widthInput" placeholder="20 cm">
                </div>

                <div class="data-input">
                    <label for="heightInput">Height</label>
                    <input type="number" name="height" id="heightInput" placeholder="30 cm">
                </div>

                <div class="data-input">
                    <label for="lengthInput">Length</label>
                    <input type="number" name="length" id="lengthInput" placeholder="5 cm">
                </div>

                <div class="data-input">
                    <label for="weightInput">Weight</label>
                    <input type="number" name="weight" id="weightInput" placeholder="700 gram">
                </div>
            </fieldset>
        </form>
    </main>
    <app-footer></app-footer>
</body>
</html>
